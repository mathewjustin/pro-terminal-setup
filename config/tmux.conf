# Portable tmux defaults for Ghostty/iTerm-style terminals.

set -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
set -g default-command /home/linuxbrew/.linuxbrew/bin/zsh

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",ghostty:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"

set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style "fg=#89b4fa,bold"
set -g status-left " #S "
set -g status-right-style "fg=#a6adc8"
set -g status-right " %H:%M "
setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#a6adc8"
setw -g window-status-format " #I:#W "
