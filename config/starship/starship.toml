format = """
$directory
$git_branch$git_status$nodejs$java$docker_context$cmd_duration
$character"""

palette = "catppuccin_mocha"
add_newline = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
overlay0 = "#6c7086"
surface0 = "#313244"
surface1 = "#45475a"
base = "#1e1e2e"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold peach)"

[directory]
style = "bold base bg:blue"
format = "[ $path ]($style)[$read_only]($read_only_style) "
truncation_length = 8
truncation_symbol = ".../"
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"
read_only_style = "bold red bg:blue"

[git_branch]
symbol = "git:"
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[nodejs]
symbol = "node "
style = "dimmed green"
format = "[$symbol($version)]($style) "

[java]
symbol = "java "
style = "dimmed red"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = "docker "
style = "dimmed sky"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 1000
style = "dimmed yellow"
format = "took [$duration]($style) "
