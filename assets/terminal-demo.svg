  <rect x="70" y="58" width="820" height="444" rx="18" fill="url(#bg)" filter="url(#shadow)" stroke="#313244"/>
  <rect x="70" y="58" width="820" height="42" rx="18" fill="#181825"/>
  <circle cx="98" cy="79" r="7" fill="#f38ba8"/>
  <circle cx="122" cy="79" r="7" fill="#f9e2af"/>
  <circle cx="146" cy="79" r="7" fill="#a6e3a1"/>
  <text x="480" y="84" fill="#6c7086" font-size="14" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" text-anchor="middle">Ghostty • Pro Terminal Setup</text>

  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20">
    <rect x="102" y="128" width="310" height="34" rx="8" fill="#89b4fa"/>
    <text x="118" y="151" fill="#1e1e2e" font-weight="700">~/hr-solution</text>
    <text x="102" y="197" fill="#a6e3a1" font-weight="700">❯</text>
    <text x="132" y="197" fill="#cdd6f4">z hr</text>
    <text x="102" y="237" fill="#f38ba8">java v25.0.2</text>
    <text x="102" y="277" fill="#cba6f7">git:main</text>
    <text x="210" y="277" fill="#fab387">(!2 ?1)</text>
    <text x="102" y="337" fill="#a6e3a1" font-weight="700">❯</text>
    <text x="132" y="337" fill="#cdd6f4">ll</text>
    <text x="102" y="377" fill="#89b4fa">drwxr-xr-x</text>
    <text x="258" y="377" fill="#cdd6f4">src</text>
    <text x="102" y="411" fill="#89b4fa">-rw-r--r--</text>
    <text x="258" y="411" fill="#cdd6f4">pom.xml</text>
    <text x="102" y="451" fill="#a6e3a1" font-weight="700">❯</text>
