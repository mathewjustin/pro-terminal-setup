  <g transform="translate(545 148)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="0" width="294" height="240" rx="12" fill="#11111b" stroke="#45475a"/>
    <text x="18" y="32" fill="#89b4fa" font-size="16" font-weight="700">terminal-intro</text>
    <text x="18" y="70" fill="#cdd6f4" font-size="14">Starship = smarter prompt</text>
    <text x="18" y="100" fill="#cdd6f4" font-size="14">zoxide   = smarter cd</text>
    <text x="18" y="130" fill="#cdd6f4" font-size="14">fzf      = interactive search</text>
    <text x="18" y="160" fill="#cdd6f4" font-size="14">kubectl  = k, kg, kd, kl</text>
